<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Economía en Acción — I.E. República de Argentina</title><style>
:root{--azul:#1e3a8a;--claro:#eff6ff;--oro:#facc15;--texto:#17233c;--borde:#d8e2f1}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,Arial,sans-serif;color:var(--texto);background:#edf3fc}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 18px;background:var(--azul);color:white;font-weight:700}button:hover{filter:brightness(1.08)}button:focus-visible,input:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}.secondary{background:white;color:var(--azul);border:2px solid var(--azul)}.gold{background:var(--oro);color:#172554}.shell{max-width:1080px;margin:auto;padding:16px}.top{display:flex;gap:15px;align-items:center;background:var(--azul);color:white;padding:14px 18px;border-radius:16px}.top img{width:65px;height:65px;object-fit:contain;background:white;border-radius:10px;padding:4px}.top h1{font-size:1.35rem;margin:0}.top p{margin:0;font-size:.86rem}.screen{background:white;border-radius:18px;padding:clamp(16px,4vw,32px);margin-top:16px;box-shadow:0 8px 25px #18315312}.hero{text-align:center;padding:20px 8px}.hero h2{font-size:clamp(2rem,6vw,3.7rem);color:var(--azul);margin:8px}.hero p{font-size:1.1rem}.hero-art{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,#dbeafe,#dcfce7);border-radius:20px;padding:28px;margin:20px auto;max-width:720px}.art{font-size:3.5rem;display:grid;justify-items:center}.art span{font-size:.83rem;font-weight:700}.controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}.start{animation:pulse 2s infinite;font-size:1.2rem;margin:20px}@keyframes pulse{50%{transform:scale(1.055);box-shadow:0 0 0 10px #facc1525}}.muted{color:#56667e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{border:2px solid var(--borde);border-radius:15px;padding:18px;background:#fbfdff}.card h3{margin:4px 0}.progress{height:12px;border-radius:30px;background:#e2e8f0;overflow:hidden}.progress>div{height:100%;background:#16a34a;transition:width .3s}.pill{background:#dbeafe;color:#1e3a8a;border-radius:30px;padding:4px 10px;font-size:.83rem}.avatars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:460px}.avatar{background:#f1f5f9;color:#172554;border:2px solid transparent;font-size:1.1rem}.avatar[aria-pressed=true]{border-color:var(--azul);background:#dbeafe}.field{display:block;width:100%;max-width:460px;padding:12px;border:2px solid #b8c8df;border-radius:10px;margin:6px 0 15px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.feedback{padding:12px;border-radius:12px;background:#fef9c3;margin:12px 0}.good{background:#dcfce7}.error{background:#fee2e2}.choices{display:grid;gap:10px}.choice{display:block;width:100%;text-align:left;background:#f1f5f9;color:#172554;border:2px solid #dbeafe}.choice[aria-pressed=true]{background:#dbeafe;border-color:var(--azul)}.dropzones{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.zone{border:2px dashed #93c5fd;border-radius:12px;padding:14px;min-height:130px;background:#eff6ff}.token{display:inline-block;background:#fef3c7;border:1px solid #fbbf24;color:#172554;border-radius:8px;padding:7px;margin:4px;cursor:grab}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.metric{text-align:center;background:#eff6ff;border-radius:12px;padding:14px}.metric strong{font-size:1.6rem;display:block;color:var(--azul)}.sr{position:absolute;left:-9999px}footer{text-align:center;color:#64748b;padding:25px} @media(max-width:550px){.top img{width:50px;height:50px}.top h1{font-size:1.05rem}.avatars{grid-template-columns:repeat(2,1fr)}.screen{padding:17px}}
@media print{.top,button,.actions,.controls{display:none!important}.screen{box-shadow:none}}
</style></head><body><div class="shell"><header class="top"><img src="assets/insignia-oficial.jpg" alt="Insignia oficial I.E. República de Argentina, Villa de Pasco"><div><h1>ECONOMÍA EN ACCIÓN</h1><p>I.E. «República de Argentina» – Villa de Pasco · Ciencias Sociales · 1.° secundaria</p></div></header><main id="app" class="screen" aria-live="polite"></main><footer>Proyecto educativo · Docente: Lic. Jacquelin Edith Vicente Condor · Funciona sin Internet</footer></div><script>
'use strict';
// Prototipo sin backend: el almacenamiento local NO sustituye autenticación ni PostgreSQL.
const $=s=>document.querySelector(s), app=$('#app');const KEY='economia-accion-demo-v1';
const units=[{name:'Necesidades, bienes y servicios',topics:[['Las necesidades humanas','Las necesidades son aquello que las personas requieren para vivir y desarrollarse.','Alimentación y abrigo en el clima de Pasco.','¿Cuál es una necesidad básica?',['Alimentación','Juguete de lujo','Publicidad'],0],['Bienes económicos','Los bienes son objetos que satisfacen necesidades y requieren recursos para producirse.','Una chompa tejida con lana de alpaca.','¿Cuál es un bien?',['Transporte público','Una chompa','Atención médica'],1],['Los servicios','Los servicios son actividades que satisfacen necesidades sin entregar necesariamente un objeto material.','Transporte de pasajeros hacia Cerro de Pasco.','¿Cuál es un servicio?',['Una oveja','Una mesa','Transporte público'],2]]},{name:'Sectores productivos',topics:[['Sector primario','Obtiene recursos directamente de la naturaleza.','Crianza de alpacas y ovejas en Villa de Pasco.','¿Qué actividad pertenece al sector primario?',['Ganadería','Tejido industrial','Venta de prendas'],0],['Sector secundario','Transforma materias primas en productos elaborados.','Transformación de lana en prendas de vestir.','¿Cuál es una transformación industrial?',['Pastorear alpacas','Fabricar chompas','Vender chompas'],1],['Sector terciario','Ofrece servicios y comprende actividades comerciales.','Comercio local y transporte de pasajeros.','¿Cuál corresponde al sector terciario?',['Extracción minera','Hilado industrial','Venta en una tienda'],2]]},{name:'Agentes económicos',topics:[['Las familias','Consumen bienes y servicios, ofrecen trabajo y toman decisiones económicas.','Una familia compra alimentos y trabaja en la ganadería.','¿Qué realiza una familia como consumidora?',['Compra alimentos','Aprueba leyes','Construye una fábrica pública'],0],['Las empresas','Organizan recursos para producir bienes o prestar servicios.','Una empresa transforma lana en textiles.','¿Qué función cumple una empresa?',['Cobrar todos los impuestos','Producir bienes o servicios','Dictar normas nacionales'],1],['El Estado','Establece reglas, presta servicios públicos y participa en la economía.','Una municipalidad mantiene vías y servicios públicos.','¿Qué acción corresponde al Estado?',['Comprar para el hogar','Vender prendas privadas','Proveer servicios públicos'],2]]},{name:'Economía de Villa de Pasco',topics:[['Ganadería y minería','La ganadería y la minería extraen u obtienen recursos y forman parte del sector primario.','Cría de ovinos y actividad minera en la región Pasco.','¿Cuál pertenece al sector primario?',['Extracción minera','Venta minorista','Transporte'],0],['Comercio y transporte','El comercio distribuye bienes y el transporte facilita el desplazamiento de personas y productos.','Mercados y transporte entre localidades de Pasco.','¿Qué actividad ofrece un servicio?',['Criar ovejas','Transportar pasajeros','Extraer minerales'],1],['Relaciones económicas','Los sectores y agentes se conectan desde la obtención de recursos hasta el consumo.','Familias compran textiles que una empresa elaboró con lana local.','¿Quién compra el producto para satisfacer necesidades?',['La materia prima','El sector primario','La familia consumidora'],2]]}]}];
const topics=units.flatMap((u,ui)=>u.topics.map((t,ti)=>({ui,ti,t})));const icons=['🐑','⛏️','🌾','🛒','🚌','🏭'];let state={page:'cover',alias:'',avatar:0,topic:0,answers:{},attempts:{},quizStep:0,quizScore:0,quizCorrect:0,quizErrors:0,quizStarted:0,quizLog:[],quizDone:false};
try{let old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&typeof old==='object'){state.alias=String(old.alias||'').slice(0,40);state.avatar=Number(old.avatar)||0;state.answers=old.answers||{};state.attempts=old.attempts||{}}}catch{}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({alias:state.alias,avatar:state.avatar,answers:state.answers,attempts:state.attempts,lastResult:state.lastResult||null}))}catch{}}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(page){state.page=page;render();scrollTo({top:0,behavior:'smooth'})}function progress(n,total){return `<div class="progress" role="progressbar" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${total}"><div style="width:${Math.round(n/total*100)}%"></div></div>`}
function cover(){app.innerHTML=`<section class="hero"><h2>¡ECONOMÍA EN ACCIÓN!</h2><p>Descubrimos los sectores productivos y los agentes económicos</p><div class="hero-art" role="img" aria-label="Ilustración de ganadería, minería, agricultura, comercio, transporte e industria en la economía local">${icons.map((i,k)=>`<div class="art">${i}<span>${['Ganadería','Minería','Agricultura','Comercio','Transporte','Industria'][k]}</span></div>`).join('')}</div><p>Aprende con ejemplos de Villa de Pasco, retos y retroalimentación.</p><div class="controls"><button id="music" class="secondary" aria-pressed="false">▶ Música</button><label for="volume">Volumen</label><input id="volume" type="range" min="0" max="100" value="25" aria-label="Volumen musical"></div><button class="gold start" id="start">INICIAR →</button></section>`;$('#start').onclick=()=>nav('register');$('#music').onclick=toggleMusic;$('#volume').oninput=e=>{if(gain)gain.gain.value=Number(e.target.value)/100*.08}}
let audio=null,gain=null,osc=null;function toggleMusic(){try{if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();gain=audio.createGain();gain.gain.value=.02;gain.connect(audio.destination);osc=audio.createOscillator();osc.type='sine';osc.frequency.value=392;osc.connect(gain);osc.start()}if(audio.state==='running'){audio.suspend();$('#music').textContent='▶ Música';$('#music').setAttribute('aria-pressed','false')}else{audio.resume();$('#music').textContent='⏸ Pausar';$('#music').setAttribute('aria-pressed','true')}}catch{alert('El navegador no admite reproducción de audio.')}}
function register(){app.innerHTML=`<h2>Pantalla 2 · Registro del estudiante</h2><p>Escribe un alias y elige un avatar. Este es un registro local de demostración.</p><label for="alias">Nombre o alias</label><input class="field" id="alias" maxlength="40" autocomplete="off" value="${safe(state.alias)}"><p><strong>Selecciona tu avatar</strong></p><div class="avatars">${icons.map((i,k)=>`<button class="avatar" data-av="${k}" aria-pressed="${k===state.avatar}">${i} ${['Alpaca','Minería','Agricultura','Comercio','Transporte','Industria'][k]}</button>`).join('')}</div><div id="regmsg" role="status"></div><div class="actions"><button class="secondary" id="back">← Portada</button><button id="continue">Continuar → Menú</button></div>`;document.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{state.avatar=Number(b.dataset.av);document.querySelectorAll('[data-av]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))});$('#back').onclick=()=>nav('cover');$('#continue').onclick=()=>{let name=$('#alias').value.trim();if(!/^[\p{L}\p{N} .'-]{2,40}$/u.test(name)){$('#regmsg').innerHTML='<p class="feedback error">Ingresa entre 2 y 40 caracteres: letras, números, espacios, punto, apóstrofo o guion.</p>';return}state.alias=name;persist();nav('menu')}}
function menu(){let done=Object.keys(state.answers).filter(k=>state.answers[k]===true).length;app.innerHTML=`<h2>Pantalla 3 · Menú y temario</h2><p>¡Hola, <strong>${safe(state.alias||'Estudiante')}</strong>! ${icons[state.avatar]} Selecciona una unidad para aprender.</p><p>Progreso global: ${done} de 12 temas</p>${progress(done,12)}<div class="grid" style="margin-top:20px">${units.map((u,i)=>{let n=u.topics.filter((t,j)=>state.answers[topics.findIndex(p=>p.ui===i&&p.ti===j)]).length;return `<article class="card"><span class="pill">Unidad ${i+1}</span><h3>${u.name}</h3><p>${n}/3 temas completados</p>${progress(n,3)}<div class="actions"><button data-unit="${i}">Ver temas</button></div></article>`}).join('')}</div><div class="actions"><button id="alltest">Ir a actividades y evaluación</button><button class="secondary" id="logout">Salir</button></div>`;document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{state.topic=topics.findIndex(p=>p.ui===Number(b.dataset.unit));nav('topic')});$('#alltest').onclick=startQuiz;$('#logout').onclick=()=>nav('cover')}
function topic(){let x=topics[state.topic],t=x.t,attempts=state.attempts[state.topic]||0,finished=state.answers[state.topic]===true;app.innerHTML=`<p class="pill">Pantalla ${state.topic+4} de 15 · Unidad ${x.ui+1}</p><h2>${t[0]}</h2><p>${progress(state.topic+1,12)}</p><div class="grid"><div class="card"><h3>¿Qué aprenderemos?</h3><p>${t[1]}</p><h3>Ejemplo de Villa de Pasco</h3><p>${t[2]}</p></div><div class="card" style="text-align:center"><div style="font-size:5rem">${icons[state.topic%6]}</div><p>Observa cómo se relaciona este tema con nuestra comunidad.</p></div></div><section class="card" style="margin-top:16px"><h3>Comprueba lo aprendido</h3><p>${t[3]}</p><div class="choices">${t[4].map((c,i)=>`<button class="choice" data-choice="${i}" ${finished||attempts>=3?'disabled':''}>${c}</button>`).join('')}</div><div id="topicmsg" role="status">${finished?'<p class="feedback good">Tema completado. ¡Muy bien!</p>':attempts>=3?`<p class="feedback">Respuesta: ${t[4][t[5]]}. ${t[1]}</p>`:''}</div></section><div class="actions"><button class="secondary" id="prev">← Anterior</button><button id="next">${state.topic===11?'Ir a evaluación':'Siguiente →'}</button><button class="secondary" id="menu">Menú</button></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let val=Number(b.dataset.choice);if(val===t[5]){state.answers[state.topic]=true;persist();$('#topicmsg').innerHTML='<p class="feedback good">¡Correcto! '+safe(t[1])+'</p>';document.querySelectorAll('[data-choice]').forEach(c=>c.disabled=true)}else{state.attempts[state.topic]=(state.attempts[state.topic]||0)+1;persist();let a=state.attempts[state.topic];$('#topicmsg').innerHTML=`<p class="feedback">${a<3?(a===1?'Pista: revisa el concepto presentado arriba.':'Piensa en el ejemplo económico de Villa de Pasco.'):'Respuesta: '+safe(t[4][t[5]])+'. '+safe(t[1])}</p>`;if(a>=3)document.querySelectorAll('[data-choice]').forEach(c=>c.disabled=true)}});$('#prev').onclick=()=>{if(state.topic>0){state.topic--;nav('topic')}else nav('menu')};$('#next').onclick=()=>{if(state.topic<11){state.topic++;nav('topic')}else startQuiz()};$('#menu').onclick=()=>nav('menu')}
// Pantalla 16: 3 retos (emparejar, selección y ordenar). Evaluación formativa independiente de nota oficial.
const quiz=[{name:'Relacionar actividades y sectores',max:7},{name:'Seleccionar agente económico',max:6},{name:'Ordenar cadena productiva',max:7}];let pairs={},ordering=[];
function startQuiz(){state.quizStep=0;state.quizScore=0;state.quizCorrect=0;state.quizErrors=0;state.quizLog=[];state.quizStarted=Date.now();state.quizDone=false;pairs={};ordering=[];nav('quiz')}
function quizView(){let step=state.quizStep;if(step>=3){finishQuiz();return}let q=quiz[step];app.innerHTML=`<h2>Pantalla 16 · Actividades y evaluación</h2><p>Reto ${step+1} de 3 · ${q.name}</p>${progress(step,3)}<p><strong>Puntaje acumulado:</strong> ${state.quizScore}/20</p><div id="challenge" class="card"></div><div id="quizmsg" role="status"></div><div class="actions"><button id="check">Comprobar respuesta</button><button class="secondary" id="menu">Volver al menú</button></div>`;$('#menu').onclick=()=>nav('menu');let el=$('#challenge');if(step===0){el.innerHTML=`<h3>Arrastra cada actividad a su sector</h3><p class="muted">También puedes seleccionar el sector desde el desplegable, útil con teclado o celular.</p>${['Ganadería','Fabricación de prendas','Comercio'].map((n,i)=>`<label>${n}<select class="field" data-pair="${i}"><option value="">Elige sector</option><option value="0">Primario</option><option value="1">Secundario</option><option value="2">Terciario</option></select></label>`).join('')}<p>Arrastre opcional:</p><div>${['Ganadería','Fabricación','Comercio'].map((n,i)=>`<span class="token" draggable="true" data-drag="${i}">${n}</span>`).join('')}</div><div class="dropzones">${['Primario','Secundario','Terciario'].map((n,i)=>`<div class="zone" data-zone="${i}">${n}<div class="placed"></div></div>`).join('')}</div>`;document.querySelectorAll('[data-drag]').forEach(e=>e.ondragstart=ev=>ev.dataTransfer.setData('text/plain',e.dataset.drag));document.querySelectorAll('[data-zone]').forEach(z=>{z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();let v=Number(e.dataTransfer.getData('text/plain'));if(!Number.isInteger(v)||v<0||v>2)return;let i=Number(z.dataset.zone);document.querySelector(`[data-pair="${v}"]`).value=String(i);z.querySelector('.placed').textContent=['Ganadería','Fabricación','Comercio'][v]}})}else if(step===1){el.innerHTML=`<h3>¿Qué agente económico establece normas y brinda servicios públicos?</h3><div class="choices">${['Familias','Empresas','Estado'].map((n,i)=>`<button class="choice" data-option="${i}" aria-pressed="false">${n}</button>`).join('')}</div>`;document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-option]').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')})}else{ordering=['Venta de la chompa','Obtención de lana','Elaboración de la chompa'];el.innerHTML=`<h3>Ordena las etapas de la cadena productiva</h3><p>Usa los botones ↑ y ↓ para cambiar el orden.</p><div id="ordering"></div>`;drawOrder()}$('#check').onclick=()=>{let valid=false,correct=false;if(step===0){let vals=[...document.querySelectorAll('[data-pair]')].map(s=>s.value);valid=vals.every(Boolean);correct=valid&&vals.every((v,i)=>Number(v)===i)}else if(step===1){let chosen=$('[data-option][aria-pressed="true"]');valid=!!chosen;correct=valid&&chosen.dataset.option==='2'}else{valid=true;correct=ordering.join('|')==='Obtención de lana|Elaboración de la chompa|Venta de la chompa'}if(!valid){$('#quizmsg').innerHTML='<p class="feedback error">Completa todas las respuestas antes de continuar.</p>';return}state.quizScore+=correct?q.max:0;state.quizCorrect+=correct?1:0;state.quizErrors+=correct?0:1;state.quizLog.push({reto:step+1,correcto:correct,puntos:correct?q.max:0});$('#quizmsg').innerHTML=`<p class="feedback ${correct?'good':''}">${correct?'¡Correcto!':'Revisa la explicación del tema y vuelve a practicar.'} ${correct?'Has aplicado correctamente el concepto.':''}</p>`;$('#check').disabled=true;let next=document.createElement('button');next.textContent=step===2?'Ver resultados →':'Siguiente reto →';next.onclick=()=>{state.quizStep++;quizView()};$('#quizmsg').append(next)}}
function drawOrder(){let root=$('#ordering');root.innerHTML=ordering.map((n,i)=>`<div class="card" style="margin:6px 0">${i+1}. ${n} <button class="secondary" data-move="${i}" data-dir="-1" ${i===0?'disabled':''} aria-label="Subir ${n}">↑</button> <button class="secondary" data-move="${i}" data-dir="1" ${i===ordering.length-1?'disabled':''} aria-label="Bajar ${n}">↓</button></div>`).join('');document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let i=+b.dataset.move,j=i+(+b.dataset.dir);[ordering[i],ordering[j]]=[ordering[j],ordering[i]];drawOrder()})}
function finishQuiz(){let seconds=Math.round((Date.now()-state.quizStarted)/1000);state.lastResult={alias:state.alias,score:state.quizScore,correct:state.quizCorrect,errors:state.quizErrors,seconds,createdAt:new Date().toISOString(),log:state.quizLog};persist();nav('results')}
function results(){let r=state.lastResult||{alias:state.alias,score:0,correct:0,errors:0,seconds:0,log:[]};let msg=r.score>=17?'¡Excelente! Continúa aplicando lo aprendido.':r.score>=11?'Buen avance. Repasa los temas en los que tuviste dificultades.':'Conviene reforzar los sectores productivos y los agentes económicos antes de repetir los retos.';app.innerHTML=`<h2>Pantalla 17 · Resultados y retroalimentación</h2><p>Estudiante: <strong>${safe(r.alias||'Estudiante')}</strong></p><div class="metrics"><div class="metric"><strong>${r.correct}</strong>Aciertos</div><div class="metric"><strong>${r.errors}</strong>Errores</div><div class="metric"><strong>${Math.floor(r.seconds/60)}:${String(r.seconds%60).padStart(2,'0')}</strong>Tiempo</div><div class="metric"><strong>${r.score}/20</strong>Puntaje</div></div><h3>Progreso de la evaluación</h3>${progress(r.score,20)}<div class="feedback"><strong>Sugerencia de refuerzo:</strong> ${msg}</div><p class="muted">Resultado de práctica formativa; no equivale a una calificación oficial.</p><div class="actions"><button id="retry">Reintentar</button><button class="secondary" id="menu">Volver al menú</button><button class="secondary" id="pdf">Descargar reporte PDF</button></div>`;$('#retry').onclick=startQuiz;$('#menu').onclick=()=>nav('menu');$('#pdf').onclick=()=>window.print()}
function render(){if(state.page==='cover')cover();else if(state.page==='register')register();else if(state.page==='menu')menu();else if(state.page==='topic')topic();else if(state.page==='quiz')quizView();else if(state.page==='results')results()}render();
</script></body></html>
